apiVersion: v1
kind: ConfigMap
metadata:
  name: app-settings # пример конфига для всего сервиса
data:
  # пишем сколько угодно переменных
  SERVICE_MODE: "production"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  EXTERNAL_API_URL: "https://api.google.com"
  RETRY_COUNT: "5"

---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets # пример секрета для всех паролей сервиса
type: Opaque
stringData:
  # сюда записываем пароли
  DB_PASSWORD: "super-strong-password"
  API_KEY_GOOGLE: "aiza-sy-12345"
  API_KEY_STRIPE: "sk_live_98765"