services:
  # Наша база данных (PostgreSQL)
  postgres:
    image: postgres:16
    container_name: powerbi_source_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_scripts/init-schemas-and-tables.sql:/docker-entrypoint-initdb.d/1-init-schemas-and-tables.sql
      - ./init_scripts/procedures.sql:/docker-entrypoint-initdb.d/2-procedures.sql
      - ./init_scripts/etl-example.sql:/docker-entrypoint-initdb.d/3-etl-execute.sql
      - ./csv_files:/file_storage 
  
  python-app:
    image: python:3.12-slim
    container_name: creating_secondary_input
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "pip install --upgrade pip && 
             pip install -r requirements.txt && 
             python data_preprocessing.py"
    # Для Windows/Mac полезно, чтобы видеть вывод сразу
    tty: true 
    stdin_open: true

volumes:
  postgres_data: